[project]
name = "gaes4qco"
version = "0.2.1"
description = "Pacote para otimização de Circuitos Quânticos"
authors = []
dependencies = [
    "qiskit==0.46.0",
    "numpy",
    "dependency-injector",
    "qiskit-aer-gpu==0.13.3",
    "qiskit-ibm-provider==0.9.0",
    "matplotlib"
]
readme = "README.md"
requires-python = ">=3.9, <3.12"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "qiskit-ibm-runtime",
    "pytest",
    "black",
    "matplotlib"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"GAES4QCO" = ["data/*", "models/*"]

[tool.setuptools.packages.find]
include = ["GAES4QCO*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
onsafety-ia-epi = "GAES4QCO.arquivo:main"